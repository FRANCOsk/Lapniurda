<section class="center" aria-labelledby="contact-heading">
  <h2 id="contact-heading">Contact</h2>

  <label for="name">Name</label>
  <input type="text" id="name" name="name" placeholder="Peter" autocomplete="given-name" />

  <label for="lastname">Last name</label>
  <input type="text" id="lastname" name="lastname" placeholder="Novak" autocomplete="family-name" />

  <label for="street">Street</label>
  <input type="text" id="street" name="street" placeholder="Hlavna" autocomplete="street-address" />

  <label for="city">City</label>
  <input type="text" id="city" name="city" placeholder="Kosice" autocomplete="address-level2" />

  <label for="email">Email</label>
  <input type="email" id="email" name="email" placeholder="peter@post.sk" autocomplete="email" />

  <div class="social-links" aria-label="Social media links">
    <button type="button" class="btn btn-primary" (click)="openFacebook()" aria-label="Open Facebook">
      <svg class="bi" width="32" height="32" fill="currentColor" aria-hidden="true">
        <use href="assets/bootstrap-icons.svg#facebook"></use>
      </svg>
    </button>

    <button type="button" class="btn btn-primary" (click)="openInstagram()" aria-label="Open Instagram">
      <svg class="bi" width="32" height="32" fill="currentColor" aria-hidden="true">
        <use href="assets/bootstrap-icons.svg#instagram"></use>
      </svg>
    </button>

    <button type="button" class="btn btn-danger" (click)="openYouTube()" aria-label="Open YouTube">
      <svg class="bi" width="32" height="32" fill="currentColor" aria-hidden="true">
        <use href="assets/bootstrap-icons.svg#youtube"></use>
      </svg>
    </button>
  </div>
</section>
